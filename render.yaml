databases:
  - name: keyword-share-db
    plan: free
    databaseName: keyword_share
    user: app

services:
  - type: web
    name: keyword-share-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keyword-share-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_UPLOAD_MEGAPIXELS
        value: "100"
      - key: PUBLIC_DEMO_ENABLED
        value: "true"
      - key: VITE_API_BASE_URL
        value: "/api"
      - key: NODE_VERSION
        value: "20"
